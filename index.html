<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:root{--disp:Impact,'Arial Black',sans-serif}
#hTitle,#hRound,#winName,#winFollow,#startBtn,.pTitle,#ldName{font-family:var(--disp)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
/* ---------- header ---------- */
header{flex:0 0 auto;position:relative;text-align:center;padding:calc(10px + env(safe-area-inset-top)) 52px 6px;z-index:5;transition:opacity .6s}
header.dim{opacity:.16}
#hTitle{font-weight:900;font-style:italic;font-size:clamp(24px,6.5vw,40px);letter-spacing:.5px;line-height:1.05;transform:skewX(-3deg)}
#hRound{color:#ff2b3a;font-weight:800;font-size:clamp(12px,3.4vw,17px);letter-spacing:3px;margin-top:3px}
#gearBtn{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));width:38px;height:38px;border-radius:50%;background:#101014;border:1px solid #26262e;color:#9a9aa4;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:7}
#gearBtn:active{transform:scale(.92)}
/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 auto;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#slowBadge{position:absolute;top:10px;left:50%;transform:translateX(-50%) translateY(-6px);display:flex;align-items:center;gap:7px;background:rgba(14,14,17,.9);border:1px solid #2c2c34;border-radius:20px;padding:6px 14px;font-size:11px;font-weight:800;letter-spacing:2px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:4}
#slowBadge.on{opacity:1;transform:translateX(-50%) translateY(0)}
#slowBadge .dot{width:7px;height:7px;border-radius:50%;background:#ff2b3a;box-shadow:0 0 8px #ff2b3a;animation:dotBlink 1s infinite}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.25}}
#startBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;padding:13px 44px;font-size:15px;font-weight:800;letter-spacing:4px;color:#fff;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.9);border-radius:40px;cursor:pointer;transition:transform .15s,box-shadow .3s,background .3s;font-family:inherit}
#startBtn:active{transform:translateX(-50%) scale(.95)}
#startBtn.gold{border-color:#ffb03a;color:#ffb03a;background:rgba(255,176,58,.06);box-shadow:0 0 26px rgba(255,176,58,.28)}
/* ---------- footer ---------- */
#foot{flex:0 0 auto;text-align:center;color:#6c6c75;font-size:12px;letter-spacing:1.5px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));font-weight:600}
/* ---------- winner overlay ---------- */
#winOv{position:absolute;inset:0;z-index:8;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#winMove{position:absolute;left:0;top:0;width:0;height:0;z-index:8}
.winLogo{position:absolute;left:0;top:0;border-radius:50%;object-fit:cover;transition:transform .8s cubic-bezier(.2,1.15,.3,1);will-change:transform}
.wCol{display:flex;align-items:center;justify-content:center;color:#fff}
.w-el{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.3,1.15)}
#winName{font-weight:900;font-size:clamp(28px,8.4vw,46px);letter-spacing:1px;text-shadow:0 0 26px rgba(255,255,255,.4);transition-delay:.55s}
#winTrophy{font-size:30px;margin-top:4px;filter:drop-shadow(0 0 12px rgba(255,190,60,.65));transition-delay:.85s}
#winFollow{margin-top:10px;color:#ffb03a;font-weight:800;font-size:clamp(14px,4.2vw,19px);letter-spacing:2px;text-shadow:0 0 16px rgba(255,176,58,.6);transition-delay:1.05s;animation:glowPulse 2s ease-in-out 1.4s infinite}
@keyframes glowPulse{0%,100%{text-shadow:0 0 10px rgba(255,176,58,.45)}50%{text-shadow:0 0 24px rgba(255,176,58,.95)}}
#winNext{margin-top:10px;background:none;border:none;color:#8b8b94;font-weight:800;font-size:12px;letter-spacing:3px;cursor:pointer;pointer-events:auto;opacity:0;transition:opacity .5s;padding:8px 14px;font-family:inherit}
#winNext.on{opacity:1}
#winNext:active{transform:scale(.95)}
#winOv.winOvShow .w-el{opacity:1;transform:none}
/* ---------- settings panel ---------- */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
#backdrop.on{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:#0a0a0d;border-left:1px solid #1c1c22;z-index:60;transform:translateX(103%);transition:transform .32s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column}
#panel.open{transform:none}
#pHead{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid #17171d}
#pHead img{width:30px;height:30px;border-radius:8px}
.pTitle{font-weight:900;font-size:14px;letter-spacing:2px}
.pTitle span{color:#ffb03a}
#pClose{margin-left:auto;background:none;border:none;color:#8b8b94;font-size:24px;cursor:pointer;line-height:1;padding:4px}
#pBody{flex:1;overflow-y:auto;padding:6px 14px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#pBody::-webkit-scrollbar{width:4px}
#pBody::-webkit-scrollbar-thumb{background:#26262e;border-radius:2px}
#pBody h3{font-size:10px;letter-spacing:2.5px;color:#77777f;margin:20px 0 10px;font-weight:800}
.note{font-size:10px;color:#55555e;letter-spacing:.5px;margin:-6px 0 10px}
.slot{background:#101014;border:1px solid #1e1e26;border-radius:12px;padding:10px;margin-bottom:10px}
.slot.off{display:none}
.slot-top{display:flex;gap:10px;align-items:center}
.logoBtn{position:relative;width:48px;height:48px;border-radius:50%;border:1.5px dashed #34343e;background:#0d0d11;cursor:pointer;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#55555e;font-size:20px}
.logoBtn:active{border-color:#666}
.logoBtn img{width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;inset:0}
.nameIn{flex:1;min-width:0;background:#0d0d11;border:1px solid #23232c;border-radius:8px;color:#fff;font-size:13px;font-weight:700;letter-spacing:1px;padding:11px 10px;outline:none;font-family:inherit}
.nameIn:focus{border-color:#4a4a55}
.slot-row{display:flex;gap:12px;margin-top:10px;align-items:flex-end}
.slot-row label{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:9px;letter-spacing:1.5px;color:#6f6f78;font-weight:800}
.lr{display:flex;align-items:center;gap:6px}
.val{color:#cfcfd6;font-size:10px;font-weight:800;min-width:34px;text-align:right}
input[type=range]{width:100%;accent-color:#fff;height:22px;cursor:pointer}
input[type=color]{width:38px;height:28px;border:none;background:none;cursor:pointer;padding:0}
input[type=color]::-webkit-color-swatch{border-radius:6px;border:1px solid #333}
.ctl{margin-bottom:12px}
.ctl .lab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.5px;color:#cfcfd6;font-weight:700;margin-bottom:2px}
.ctl .lab b{color:#fff;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:12px;color:#cfcfd6;font-weight:700;gap:10px}
.tg{width:46px;height:25px;border-radius:20px;background:#23232c;border:none;position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto}
.tg::after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:#8b8b94;top:3px;left:3px;transition:left .2s,background .2s}
.tg.on{background:#fff}
.tg.on::after{left:24px;background:#000}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 0;background:#101014;border:1px solid #23232c;color:#8b8b94;font-weight:800;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
.seg button.on{background:#fff;color:#000;border-color:#fff}
.textIn{width:100%;background:#0d0d11;border:1px solid #23232c;border-radius:8px;color:#fff;font-size:13px;padding:11px 10px;margin-bottom:10px;text-align:center;letter-spacing:1.5px;font-weight:700;outline:none;font-family:inherit}
.brandRow{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.brandRow .textIn{margin-bottom:0}
select.textIn{cursor:pointer;appearance:none;-webkit-appearance:none}
select.textIn option{background:#101014;color:#fff}
.textIn:focus{border-color:#4a4a55}
.hsItem{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #14141a;font-size:12px}
.hsItem:last-child{border-bottom:none}
.hsRank{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;background:#1a1a20;color:#8b8b94;flex:0 0 auto}
.hsRank.r1{background:#3a2c10;color:#ffb03a}.hsRank.r2{background:#26262c;color:#c9c9d1}.hsRank.r3{background:#2e1d14;color:#d08b5b}
.hsName{flex:1;font-weight:800;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsMeta{color:#8b8b94;font-weight:700;font-size:11px;white-space:nowrap}
.hsEmpty{color:#55555e;font-size:11px;letter-spacing:1px;padding:6px 0}
.btnRow{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:10px;font-weight:800;font-size:12px;letter-spacing:2px;cursor:pointer;border:1px solid #23232c;background:#101014;color:#cfcfd6;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.primary{background:#fff;color:#000;border-color:#fff}
.pFoot{text-align:center;color:#3c3c44;font-size:9px;letter-spacing:3px;margin-top:22px;font-weight:800}
/* ---------- loader ---------- */
#loader{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
#ldLogo{width:124px;height:124px;border-radius:28px;animation:ldPulse 1.5s ease-in-out infinite}
@keyframes ldPulse{0%,100%{box-shadow:0 0 28px rgba(255,255,255,.10);transform:scale(1)}50%{box-shadow:0 0 64px rgba(255,176,58,.28);transform:scale(1.05)}}
#ldName{font-weight:900;letter-spacing:7px;font-size:16px}
#ldName span{color:#ffb03a}
#ldBar{width:170px;height:3px;background:#1c1c22;border-radius:2px;overflow:hidden}
#ldFill{height:100%;width:0%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
#ldTxt{font-size:9px;letter-spacing:4px;color:#55555e;font-weight:800}
</style>
</head>

  ],

function mergeCfg(j){
  const d=deep(DEF);
  if(!j)return d;
  d.count=clamp(j.count??4,1,4);
  (j.balls||[]).forEach((b,i)=>{ if(i>3)return;
    d.balls[i].name=(b.name??d.balls[i].name).slice(0,16);
    d.balls[i].color=b.color||d.balls[i].color;
    d.balls[i].angle=clamp(+b.angle||0,0,359);
    d.balls[i].size=clamp(+b.size||d.balls[i].size,55,140);
    d.balls[i].img=(b.img&&typeof b.img==='string'&&b.img.length<500000)?b.img:null;
  });
  for(const k in d.game) if(j.game&&j.game[k]!==undefined) d.game[k]=j.game[k];
  for(const k in d.text) if(j.text&&j.text[k]!==undefined) d.text[k]=String(j.text[k]);
  if(j.brand){ d.brand.img=(j.brand.img&&typeof j.brand.img==='string'&&j.brand.img.length<400000)?j.brand.img:null; d.brand.name=String(j.brand.name||d.brand.name).slice(0,18); }
  return d;
}
let S;
try{ S=mergeCfg(JSON.parse(localStorage.getItem('dp_settings_v2'))); }catch(e){ S=deep(DEF); }
let saveT=null;
function saveCfg(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{
      const s=deep(S);
      if(s.brand.img&&s.brand.img.length>400000)s.brand.img=null;

      if(big.length) s.balls.forEach(b=>{ if(b.img&&b.img.length>400000)b.img=null; });
      localStorage.setItem('dp_settings_v2',JSON.stringify(s));
    }catch(e){}
  },400);
}

/* ---------------- audio (tiny synth) ---------------- */
let AC=null,master=null,lastBS=0;
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination);
  }catch(e){return;}
  if(cutUrl&&!cutBuf)decodeCut(cutUrl);
}
function blip(f0,f1,dur,type,vol){
  if(!AC||!S.game.sound)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(Math.max(f0,1),t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
}
function noiseBurst(dur,vol){
  if(!AC||!S.game.sound)return;
  const t=AC.currentTime,n=AC.sampleRate*dur,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(),g=AC.createGain();
  src.buffer=buf; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(g); g.connect(master); src.start(t);
}
function sfxBounce(v){ if(!AC||!S.game.sound)return; if(AC.currentTime-lastBS<.09)return; lastBS=AC.currentTime; blip(150,65,.07,'triangle',.09*(v||1)); }

function sfxWin(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>blip(f,f,.16,'sine',.13),i*95)); }
/* the FAAAAAA meme sound — played whenever a line gets cut */
function sfxF(vol){
  vol=vol||1;
  if(!AC||!S.game.sound)return;
  const t0=AC.currentTime,dur=.5,n=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++){
    const x=i/n;
    const env=x<.06?x/.06:(x>.82?(1-x)/.18:1);
    d[i]=(Math.random()*2-1)*env;
  }
  const src=AC.createBufferSource();src.buffer=buf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(950,t0);bp.frequency.linearRampToValueAtTime(620,t0+dur);bp.Q.value=1.6;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
  const g=AC.createGain();g.gain.value=.5*vol;
  src.connect(bp);bp.connect(lp);lp.connect(g);g.connect(master);
  src.start(t0);
  const o=AC.createOscillator(),og=AC.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(150,t0);o.frequency.linearRampToValueAtTime(105,t0+dur);
  og.gain.setValueAtTime(.001,t0);og.gain.linearRampToValueAtTime(.11*vol,t0+.08);og.gain.linearRampToValueAtTime(.001,t0+dur);
  o.connect(og);og.connect(master);o.start(t0);o.stop(t0+dur);
}
/* custom cut sound — the user uploads their own file; plays on EVERY cut (10 cuts = 10 plays, no throttle) */
let cutUrl=null,cutBuf=null,cutName='';
function setCutSound(url,name){
  cutUrl=url;cutName=name;
  if(AC&&!cutBuf)decodeCut(url);
}
function decodeCut(url){
  cutBuf=null;
  fetch(url).then(r=>r.arrayBuffer()).then(ab=>AC.decodeAudioData(ab)).then(buf=>{cutBuf=buf;}).catch(()=>{cutBuf=null;});
}
function playCut(){
  if(!S.game.sound)return;
  if(AC&&cutBuf){
    const src=AC.createBufferSource();src.buffer=cutBuf;
    const g=AC.createGain();g.gain.value=.8;
    src.connect(g);g.connect(master);src.start();
  }else sfxF();
}

/* ---------------- state ---------------- */
let W=0,H=0,DPR=1,cx=0,cy=0,scale=.5;
let balls=[],parts=[],pops=[];
let phase='idle',t=0,round=1,timeScale=1,dipT=0,shake=0,ringFlash=0,endT=0,winner=null,winShown=false,settingsOpen=false,lastKillT=0,duelT=-1,trioT=-1,duelRT=0,cutsTotal=0;
const trailImgs={};

function sizeCanvas(){
  const r=stage.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cx=W/2;cy=H/2;scale=Math.min(W,H)*.46/R;
}
window.addEventListener('resize',sizeCanvas);

/* ---------------- balls ---------------- */
function buildBalls(){
  balls=[];parts=[];pops=[];
  const rs=[];
  for(let i=0;i<S.count;i++)rs.push(R*.09*S.balls[i].size/100);
  const cr=Math.max(...rs)+16;
  for(let i=0;i<S.count;i++){
    const b=S.balls[i],a=b.angle*Math.PI/180;
    balls.push({i,name:b.name||('PLAYER '+(i+1)),color:b.color,ang:a,r:rs[i],
      x:Math.cos(a)*cr,y:Math.sin(a)*cr,vx:0,vy:0,facing:a,
      teth:[],maxTeth:0,nT:-9,score:0,alive:true,pT:-9,img:trailImgs[i]||null});
  }
  timeScale=1;dipT=0;shake=0;ringFlash=0;endT=0;winner=null;winShown=false;lastKillT=0;duelT=-1;trioT=-1;duelRT=0;cutsTotal=0;
  renderTexts();
}
function renderTexts(){
  hTitle.textContent=S.text.title;
  hRound.textContent=S.text.round+' '+round;
  foot.textContent=S.text.handle;
}
function launch(){
  t=0;phase='running';
  for(const b of balls){ const a=b.ang+rand(-.12,.12); b.vx=Math.cos(a)*S.game.speed; b.vy=Math.sin(a)*S.game.speed; b.facing=a; }
  startBtn.style.display='none';
  blip(300,620,.12,'sine',.08);
}
function toIdle(){
  winOv.classList.remove('winOvShow');winNext.classList.remove('on');
  header.classList.remove('dim');
  startBtn.style.display='block';startBtn.textContent='START';startBtn.classList.remove('gold');
  buildBalls();phase='idle';
}

/* ---------------- physics helpers ---------------- */
function normalize(b){ const s=Math.hypot(b.vx,b.vy)||1; const k=S.game.speed/s; b.vx*=k;b.vy*=k; }
function addTeth(b,th){
  if(b.teth.length>=45)return;   /* fan full — a line only ever dies when it is cut */
  for(let i=b.teth.length-1;i>=0;i--){
    let dA=th-b.teth[i].a; while(dA>Math.PI)dA-=TAU; while(dA<-Math.PI)dA+=TAU;
    if(Math.abs(dA)<.012)return;
  }
  b.teth.push({a:th,t0:t});
  if(b.teth.length>b.maxTeth)b.maxTeth=b.teth.length;
}
function ringT(x,y,ux,uy){
  const pd=x*ux+y*uy;
  return -pd+Math.sqrt(Math.max(0,pd*pd-(x*x+y*y-R*R)));
}
function distPtSeg(px,py,ax,ay,bx,by){
  const abx=bx-ax,aby=by-ay;
  const f=clamp(((px-ax)*abx+(py-ay)*aby)/((abx*abx+aby*aby)||1),0,1);
  return Math.hypot(px-(ax+abx*f),py-(ay+aby*f));
}
function segCircle(ox,oy,ux,uy,len,cx2,cy2,r){
  const fx=ox-cx2,fy=oy-cy2;
  const a2=ux*ux+uy*uy,b2=2*(fx*ux+fy*uy),c2=fx*fx+fy*fy-r*r;
  const disc=b2*b2-4*a2*c2; if(disc<0)return false;
  const s=Math.sqrt(disc);
  const t1=(-b2-s)/(2*a2),t2=(-b2+s)/(2*a2);
  return (t1>0&&t1<=len)||(t2>0&&t2<=len);
}
function burst(x,y,c,n){ for(let i=0;i<n;i++){ const a=rand(0,TAU),s=rand(60,380);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.8),c:Math.random()<.7?c:'#ffffff',r:rand(1.6,4)}); } }
function sparks(x,y,c,n,dir){ for(let i=0;i<n;i++){ const a=Math.atan2(dir[1],dir[0])+rand(-1.1,1.1),s=rand(40,220);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.6),c:Math.random()<.75?c:'#fff',r:rand(1.2,2.6)}); } }
function updFx(dt){
  for(const p of parts){ p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=(1-1.6*dt);p.vy*=(1-1.6*dt);p.vy+=40*dt;p.life-=dt; }
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){ p.t+=dt;p.y-=22*dt; }
  pops=pops.filter(p=>p.t<p.life);
  shake*=Math.exp(-6*dt); if(shake<.08)shake=0;
  ringFlash*=Math.exp(-5*dt);
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

/* ---------------- game update ---------------- */
function update(dt){
  t+=dt;
  const alive=balls.filter(b=>b.alive);
  const aliveCount=alive.length;
  const killOK=t>S.game.warmup;
  /* track when the final duel begins */
  if(aliveCount===2&&duelT<0){duelT=t;duelRT=0;}
  if(aliveCount!==2){duelT=-1;duelRT=0;}
  if(aliveCount===2)duelRT+=dt;
  /* time scale — slow motion when someone is about to be cut, and in the late duel */
  let target=1;
  let imminent=false;
  if(killOK&&S.game.slowOn){
    for(const a of alive){ if(a.teth.length>0&&a.teth.length<=3){imminent=true;break;} }
  }
  if(S.game.slowOn&&aliveCount===2&&duelT>=0&&t-duelT>4)target=S.game.slowFactor;
  if(S.game.slowOn&&aliveCount===3&&trioT>=0&&t-trioT>1.5&&t-trioT<8.5)target=Math.min(target,.5);
  if(imminent)target=Math.min(target,S.game.slowFactor);
  if(dipT>0){target=.16;dipT-=dt;}
  timeScale+=(target-timeScale)*Math.min(1,dt*5);
  const dtg=dt*timeScale;

  /* integrate + score. lines are wall-anchored tethers — they spawn when the ball touches the boundary */
  for(const b of balls){
    b.px=b.x;b.py=b.y;
    if(!b.alive)continue;
    b.x+=b.vx*dtg;b.y+=b.vy*dtg;
    b.facing=Math.atan2(b.vy,b.vx);
    /* grazing the wall? anchor a line at the contact point (smooth sweep while sliding) */
    if(Math.hypot(b.x,b.y)>R-b.r-2 && t-b.nT>.033){ b.nT=t; addTeth(b,Math.atan2(b.y,b.x)); }
    b.score+=dtg*1.7;
  }
  /* wall bounce */
  for(const b of balls){ if(!b.alive)continue;
    const d=Math.hypot(b.x,b.y);
    if(d+b.r>=R){
      const nx=b.x/d,ny=b.y/d;
      b.x=nx*(R-b.r);b.y=ny*(R-b.r);
      const dot=b.vx*nx+b.vy*ny;b.vx-=2*dot*nx;b.vy-=2*dot*ny;
      normalize(b);
      sparks(b.x+nx*b.r*.5,b.y+ny*b.r*.5,b.color,10,[nx,ny]);
      if(t-b.pT>.45){ b.pT=t; pops.push({x:b.x+nx*30+rand(-14,14),y:b.y+ny*30+rand(-10,14),txt:'+'+Math.floor(b.score)+' LINES',c:b.color,life:1.3,t:0}); }
      const cang=Math.atan2(ny,nx);
      for(let k2=0;k2<10;k2++)addTeth(b,cang+(k2/9-.5)*.18);
      sfxBounce(1);
    }
  }
  /* ball-ball collision (elastic, mass by size) */
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
    const a=balls[i],b=balls[j]; if(!a.alive||!b.alive)continue;
    const dx=b.x-a.x,dy=b.y-a.y; let d=Math.hypot(dx,dy); const min=a.r+b.r;
    if(d<min&&d>.0001){
      const nx=dx/d,ny=dy/d,ma=a.r*a.r,mb=b.r*b.r,ov=min-d;
      a.x-=nx*ov*mb/(ma+mb);a.y-=ny*ov*mb/(ma+mb);
      b.x+=nx*ov*ma/(ma+mb);b.y+=ny*ov*ma/(ma+mb);
      const vrel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(vrel>0){
        const jimp=2*vrel/(1/ma+1/mb);
        a.vx-=jimp*nx/ma;a.vy-=jimp*ny/ma;
        b.vx+=jimp*nx/mb;b.vy+=jimp*ny/mb;
        normalize(a);normalize(b);
        sparks((a.x+b.x)/2,(a.y+b.y)/2,a.color,6,[nx,ny]);
        sfxBounce(.55);
      }
    }
  }
  /* balls bisect the lines they cross — the line dies + cut sound on EVERY cut (no throttle) */
  for(const b of balls){
    if(!b.alive)continue;
    const dx=b.x-b.px,dy=b.y-b.py;
    if(dx*dx+dy*dy<1)continue;
    for(const o of balls){
      if(o===b||!o.teth.length)continue;
      const oDX=o.x-o.px,oDY=o.y-o.py;
      for(let i=o.teth.length-1;i>=0;i--){
        const L=o.teth[i]; if(t-L.t0<.35)continue;   /* only same-frame spawn guard — lines cuttable as soon as they appear */
        const th=L.a,ax=Math.cos(th)*R,ay=Math.sin(th)*R;
        const corr=Math.max(2.5,b.r*.55);   /* a line crossing the ball's BODY bisects it */
        let cut=false,cxx=0,cyy=0;
        for(let s=0;s<10;s++){
          const f=s/9;
          const mx=b.px+dx*f,my=b.py+dy*f;
          const ox=o.px+oDX*f,oy=o.py+oDY*f;
          if(distPtSeg(mx,my,ax,ay,ox,oy)<corr){cut=true;cxx=mx;cyy=my;break;}
        }
        if(cut){ o.teth.splice(i,1); cutsTotal++; playCut(); sparks(cxx,cyy,o.color,4,[0,0]); }
      }
    }
  }

  /* gentle attraction in the mid game so the battle always progresses */
  if(aliveCount>2){
    const k=clamp((t-25)/10,0,1)*2.5;
    if(k>0){
      for(const b of balls){ if(!b.alive)continue;
        let best=null,bd=1e9;
        for(const o of balls){ if(o===b||!o.alive)continue;
          const d=(o.x-b.x)*(o.x-b.x)+(o.y-b.y)*(o.y-b.y);
          if(d<bd){bd=d;best=o;}
        }
        if(best){
          const want=Math.atan2(best.y-b.y,best.x-b.x);
          let dA=want-b.facing; while(dA>Math.PI)dA-=TAU; while(dA<-Math.PI)dA+=TAU;
          dA=clamp(dA,-1.2,1.2)*k*dtg;
          if(Math.abs(dA)>1e-5){
            const c=Math.cos(dA),s=Math.sin(dA);
            const nvx=b.vx*c-b.vy*s; b.vy=b.vx*s+b.vy*c; b.vx=nvx;
          }
        }
      }
    }
  }
  /* final duel: the last two steer hard toward each other for a dramatic close */
  if(aliveCount===2){
    const k=clamp((t-duelT-5)/8,0,1)*3.0;
    if(k>0){
      const duo=balls.filter(b=>b.alive);
      for(const b of duo){
        const o=duo[0]===b?duo[1]:duo[0];
        const want=Math.atan2(o.y-b.y,o.x-b.x);
        let dA=want-b.facing; while(dA>Math.PI)dA-=TAU; while(dA<-Math.PI)dA+=TAU;
        dA=clamp(dA,-1.0,1.0)*k*dtg;
        if(Math.abs(dA)>1e-5){
          const c=Math.cos(dA),s=Math.sin(dA);
          const nvx=b.vx*c-b.vy*s; b.vy=b.vx*s+b.vy*c; b.vx=nvx;
        }
      }
    }
  }
  /* a ball dies the moment it has NO lines left — no exceptions, no delays */
  if(killOK){
    let victim=null;
    for(const b of balls){
      if(!b.alive)continue;
      if(b.teth.length===0){victim=b;break;}
    }
    if(victim){
      victim.alive=false;
      lastKillT=t;
      if(balls.filter(b=>b.alive).length===3)trioT=t;
     
      dipT=.42;shake=6;ringFlash=1;burst(victim.x,victim.y,victim.color,46);
      sfxF(1.2);blip(140,50,.25,'sine',.1);
      if(balls.filter(b=>b.alive).length===1)startWinner(balls.find(b=>b.alive));
    }
  }
  /* mid-game backstop — if no fan got wiped out, the weakest fan goes */
  if(phase==='running'&&aliveCount>2&&t-lastKillT>50){
    const al2=balls.filter(b=>b.alive).sort((x,y)=>x.teth.length-y.teth.length||x.score-y.score);
    al2[0].teth.length=0;
    al2[0].alive=false;
    lastKillT=t;
   
    dipT=.42;shake=6;ringFlash=1;burst(al2[0].x,al2[0].y,al2[0].color,46);sfxF(1.2);blip(140,50,.25,'sine',.1);
    if(balls.filter(b=>b.alive).length===1)startWinner(balls.find(b=>b.alive));
  }
  /* duel safety net — the ball with fewer lines loses the final clash */
  if(phase==='running'&&aliveCount===2&&t-duelT>26){
    const duo=balls.filter(b=>b.alive);
    const lo=duo[0].teth.length<=duo[1].teth.length?duo[0]:duo[1];
    const hi=lo===duo[0]?duo[1]:duo[0];
    lo.teth.length=0;
    lo.alive=false;
    lastKillT=t;
   
    dipT=.42;shake=6;ringFlash=1;burst(lo.x,lo.y,lo.color,46);sfxF(1.2);blip(140,50,.25,'sine',.1);
    startWinner(hi);
  }
  /* solo / safety timeout */
  if(phase==='running'){
    const al=balls.filter(b=>b.alive);
    if(al.length===1&&t>10)startWinner(al[0]);
    else if(t>130)startWinner(al.sort((x,y)=>y.score-x.score)[0]);
  }
  updFx(dtg);
}
function updateEnding(dt){
  t+=dt;endT+=dt;
  let target=endT>.6?1:(S.game.slowOn?S.game.slowFactor:1);
  if(dipT>0){target=.16;dipT-=dt;}
  timeScale+=(target-timeScale)*Math.min(1,dt*4);
  const dtg=dt*timeScale;
  updFx(dtg);
  if(endT>.5&&!winShown){winShown=true;showWin();}
}
function startWinner(w){
  if(phase!=='running')return;
  phase='ending';winner=w;endT=0;winShown=false;
}
function showWin(){
  const w=winner;
  header.classList.add('dim');
  slowBadge.classList.remove('on');
  const D=clamp(Math.min(W,H)*.42,130,340);
  let el;
  if(w.img){ el=document.createElement('img'); el.src=typeof w.img==='string'?w.img:w.img.src; el.alt=''; }
  else{ el=document.createElement('div'); el.className='wCol'; el.style.background=w.color;
        el.textContent=(w.name[0]||'?').toUpperCase(); el.style.fontSize=Math.round(D*.42)+'px'; el.style.fontWeight='900'; }
  el.classList.add('winLogo');
  el.style.width=D+'px';el.style.height=D+'px';
  el.style.boxShadow=`0 0 70px ${hexA(w.color,.4)}, 0 0 26px ${hexA(w.color,.35)}`;
  const bx=cx+w.x*scale,by=cy+w.y*scale;
  winMove.style.left=bx+'px';winMove.style.top=by+'px';
  el.style.transform=`translate(${-D/2}px,${-D/2}px) scale(.4)`;
  winMove.innerHTML='';winMove.appendChild(el);
  winName.textContent=w.name.toUpperCase();
  winFollow.textContent=S.text.follow;
  winNext.textContent=S.text.next;
  winNext.classList.remove('on');
  winOv.classList.add('winOvShow');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.transform=`translate(${cx-bx-D/2}px,${cy-by-D/2}px) scale(1)`;
  }));
  setTimeout(()=>winNext.classList.add('on'),1600);
  sfxWin();
  pushHS({name:w.name,lines:Math.floor(w.score),round,date:new Date().toLocaleDateString('en-GB')});
}
function nextRound(){
  round++;
  winOv.classList.remove('winOvShow');winNext.classList.remove('on');
  header.classList.remove('dim');
  buildBalls();
  launch();
}

/* ---------------- render ---------------- */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const sx=shake?rand(-shake,shake)*scale:0,sy=shake?rand(-shake,shake)*scale:0;
  ctx.save();
  ctx.translate(cx+sx,cy+sy);ctx.scale(scale,scale);
  /* ring */
  const dimming=phase==='ending'?clamp(1-endT*1.4,0,1):1;
  const ra=.16+.84*dimming;
  ctx.lineWidth=2.8/scale;
  ctx.strokeStyle=`rgba(255,255,255,${clamp(ra*(.8+.2*Math.min(1,ringFlash*2)),0,1).toFixed(3)})`;
  if(ringFlash>.25||dimming>.9){ctx.shadowColor='rgba(255,255,255,.8)';ctx.shadowBlur=(14+30*ringFlash)/scale;}
  ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.stroke();ctx.shadowBlur=0;
  /* lines — anchored at the boundary where the ball touched, following the ball. solid, no fade, die only when cut */
  ctx.globalCompositeOperation='lighter';
  ctx.lineWidth=1.2/scale;
  for(const b of balls){
    if(!b.teth.length)continue;
    const al=.42*dimming;
    ctx.strokeStyle=hexA(b.color,al);
    ctx.beginPath();
    for(const L of b.teth){
      ctx.moveTo(Math.cos(L.a)*R,Math.sin(L.a)*R);
      ctx.lineTo(b.x,b.y);
    }
    ctx.stroke();
  }
  /* particles */
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life*2,0,1);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  /* balls */
  for(const b of balls){
    if(!b.alive)continue;
    if(phase==='ending'&&b===winner&&winShown)continue;
    ctx.save();
    ctx.shadowColor=b.color;ctx.shadowBlur=16/scale;
    if(b.img){
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.clip();
      ctx.drawImage(b.img,b.x-b.r,b.y-b.r,b.r*2,b.r*2);
    }else{
      ctx.fillStyle=b.color;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(0,0,0,.55)';
      ctx.font=`900 ${Math.round(b.r*.9)}px Arial`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText((b.name[0]||'?').toUpperCase(),b.x,b.y+b.r*.05);
    }
    ctx.restore();
  }
  ctx.restore();
  /* popups (screen space) */
  for(const p of pops){
    const a=p.t<.12?p.t/.12:clamp(1-(p.t-p.life*.55)/(p.life*.45),0,1);
    const s=p.t<.15?.6+.4*(p.t/.15):1;
    ctx.save();
    ctx.translate(cx+p.x*scale,cy+p.y*scale);ctx.scale(s,s);
    ctx.globalAlpha=clamp(a,0,1);
    ctx.font='800 13px '+dispFont;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=p.c;ctx.shadowBlur=8;ctx.fillStyle=p.c;
    ctx.fillText(p.txt,0,0);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;
  if(dt>.05)dt=.05;
  if(!settingsOpen){
    if(phase==='running')update(dt);
    else if(phase==='ending')updateEnding(dt);
  }
  render();
  slowBadge.classList.toggle('on',phase==='running'&&timeScale<.85);
  requestAnimationFrame(frame);
}

/* ---------------- settings UI ---------------- */
const slotRefs=[];
function buildUI(){
  const wrap=$('#ballSlots');
  for(let i=0;i<4;i++){
    const b=S.balls[i];
    const slot=document.createElement('div');
    slot.className='slot';slot.dataset.i=i;
    slot.innerHTML=`
      <div class="slot-top">
        <button class="logoBtn" type="button"><span class="plus">＋</span><img alt="" style="display:none"></button>
        <input class="nameIn" maxlength="14" placeholder="PLAYER ${i+1}">
      </div>
      <div class="slot-row">
        <label>Color<span class="lr"><input type="color"></span></label>
        <label>Angle<span class="lr"><input type="range" min="0" max="359" step="1"><b class="val"></b></span></label>
        <label>Size<span class="lr"><input type="range" min="55" max="140" step="1"><b class="val"></b></span></label>
      </div>
      <input type="file" accept="image/*" hidden>`;
    wrap.appendChild(slot);
    const fileIn=slot.querySelector('input[type=file]');
    const imgEl=slot.querySelector('.logoBtn img');
    const plusEl=slot.querySelector('.plus');
    const refs={slot,
      nameIn:slot.querySelector('.nameIn'),
      colIn:slot.querySelector('input[type=color]'),
      angIn:slot.querySelectorAll('input[type=range]')[0],
      sizIn:slot.querySelectorAll('input[type=range]')[1],
      angVal:slot.querySelectorAll('.val')[0],
      sizVal:slot.querySelectorAll('.val')[1],
      fileIn,imgEl,plusEl};
    refs.nameIn.value=b.name;
    refs.colIn.value=b.color;
    refs.angIn.value=b.angle;refs.angVal.textContent=b.angle+'°';
    refs.sizIn.value=b.size;refs.sizVal.textContent=b.size+'%';
    if(b.img){imgEl.src=b.img;imgEl.style.display='block';plusEl.style.display='none';}
    refs.nameIn.addEventListener('input',()=>{S.balls[i].name=refs.nameIn.value;saveCfg();if(phase==='idle')buildBalls();});
    refs.colIn.addEventListener('input',()=>{S.balls[i].color=refs.colIn.value;saveCfg();if(phase==='idle')buildBalls();});
    refs.angIn.addEventListener('input',()=>{S.balls[i].angle=+refs.angIn.value;refs.angVal.textContent=S.balls[i].angle+'°';saveCfg();if(phase==='idle')buildBalls();});
    refs.sizIn.addEventListener('input',()=>{S.balls[i].size=+refs.sizIn.value;refs.sizVal.textContent=S.balls[i].size+'%';saveCfg();if(phase==='idle')buildBalls();});
    slot.querySelector('.logoBtn').addEventListener('click',()=>fileIn.click());
    fileIn.addEventListener('change',()=>{
      const f=fileIn.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{
        const url=rd.result;
        S.balls[i].img=url;saveCfg();
        imgEl.src=url;imgEl.style.display='block';plusEl.style.display='none';
        const im=new Image();
        im.onload=()=>{trailImgs[i]=im;const bb=balls.find(x=>x.i===i);if(bb)bb.img=im;if(phase==='idle')buildBalls();};
        im.src=url;
      };
      rd.readAsDataURL(f);
      fileIn.value='';
    });
    slotRefs.push(refs);
  }
  /* count */
  const seg=$('#countSeg');
  seg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      S.count=+btn.dataset.n;saveCfg();syncCount();
      if(phase!=='running'&&phase!=='ending')toIdle();
    });
  });
  syncCount();
  /* game sliders */
  bindRange('i_speed','v_speed',v=>v+' px/s',v=>S.game.speed=v);
  bindRange('i_warmup','v_warmup',v=>v+' s',v=>S.game.warmup=v);
  bindRange('i_slowFactor','v_slowFactor',v=>Math.round(v)+' %',v=>S.game.slowFactor=v/100);
  setRange('i_speed',S.game.speed);
  setRange('i_warmup',S.game.warmup);setRange('i_slowFactor',Math.round(S.game.slowFactor*100));
  /* cut sound upload — your own sound plays on every line cut */
  const fCut=$('#f_cut'),vCut=$('#v_cut'),btnCutClr=$('#btnCutClr');
  const syncCut=()=>{vCut.textContent=cutName||'built-in FAAAAA';btnCutClr.style.display=cutName?'block':'none';};
  $('#btnCutSnd').addEventListener('click',()=>{initAudio();fCut.click();});
  fCut.addEventListener('change',()=>{
    const f=fCut.files[0];if(!f)return;
    if(f.size>2500000){alert('Keep the sound file under 2.5 MB');fCut.value='';return;}
    const rd=new FileReader();
    rd.onload=()=>{
      const url=rd.result;
      try{localStorage.setItem('dp_cut_sound',url);}catch(e){}
      setCutSound(url,f.name);syncCut();
    };
    rd.readAsDataURL(f);fCut.value='';
  });
  btnCutClr.addEventListener('click',()=>{
    try{localStorage.removeItem('dp_cut_sound');}catch(e){}
    cutUrl=null;cutBuf=null;cutName='';syncCut();
  });
  syncCut();
  /* toggles */
  const tgSlow=$('#i_slowOn'),tgSnd=$('#i_sound');
  const syncTg=()=>{tgSlow.classList.toggle('on',S.game.slowOn);tgSnd.classList.toggle('on',S.game.sound);};
  tgSlow.addEventListener('click',()=>{S.game.slowOn=!S.game.slowOn;saveCfg();syncTg();});
  tgSnd.addEventListener('click',()=>{S.game.sound=!S.game.sound;saveCfg();syncTg();initAudio();});
  syncTg();
  /* texts */
  bindText('i_title',k=>S.text.title=k);
  bindText('i_round',k=>S.text.round=k);
  bindText('i_handle',k=>S.text.handle=k);
  bindText('i_follow',k=>S.text.follow=k);
  bindText('i_next',k=>S.text.next=k);
  $('#i_title').value=S.text.title;$('#i_round').value=S.text.round;
  $('#i_handle').value=S.text.handle;$('#i_follow').value=S.text.follow;$('#i_next').value=S.text.next;
  /* brand + font */
  const bBtn=$('#brandLogoBtn'),bFile=$('#brandFile');
  bFile.addEventListener('change',()=>{const f=bFile.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{S.brand.img=String(rd.result);saveCfg();applyBrand();syncBrandUI();};rd.readAsDataURL(f);bFile.value='';});
  bBtn.addEventListener('click',()=>bFile.click());
  bindText('i_brand',k=>{S.brand.name=k;applyBrand();});
  const selF=$('#selFont');
  selF.addEventListener('change',()=>{S.game.font=selF.value;saveCfg();applyFont();});
  $('#i_brand').value=S.brand.name;selF.value=S.game.font||'impact';
  applyFont();applyBrand();syncBrandUI();
  /* buttons */
  $('#pClose').addEventListener('click',closePanel);
  backdrop.addEventListener('click',closePanel);
  $('#hsClear').addEventListener('click',()=>{try{localStorage.removeItem('dp_hs_v1');}catch(e){}renderHS();});
  $('#btnReset').addEventListener('click',()=>{
    S=deep(DEF);for(const k in trailImgs)delete trailImgs[k];
    try{localStorage.removeItem('dp_settings_v2');}catch(e){}
    applyFont();applyBrand();refreshAllInputs();toIdle();
  });
  $('#btnGo').addEventListener('click',()=>{closePanel();if(phase==='idle')launch();});
  startBtn.addEventListener('click',()=>{initAudio();if(phase==='idle')launch();});
  winNext.addEventListener('click',()=>{initAudio();nextRound();});
  $('#gearBtn').addEventListener('click',openPanel);
  document.addEventListener('pointerdown',initAudio,{once:true});
  renderHS();
  renderTexts();
}
function bindRange(id,vid,fmt,apply){
  const el=$('#'+id),v=$('#'+vid);
  el.addEventListener('input',()=>{apply(+el.value);v.textContent=fmt(+el.value);saveCfg();});
}
function setRange(id,val){
  const el=$('#'+id),v=$('#'+id.replace('i_','v_'));
  el.value=val;
  v.textContent={
    i_speed:val+' px/s',
    i_warmup:val+' s',
    i_slowFactor:Math.round(val)+' %'
  }[id]||'';
}
function bindText(id,apply){
  const el=$('#'+id);
  el.addEventListener('input',()=>{apply(el.value);saveCfg();renderTexts();});
}
function syncCount(){
  $('#countSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.n===S.count));
  slotRefs.forEach((r,i)=>r.slot.classList.toggle('off',i>=S.count));
}
function refreshAllInputs(){
  slotRefs.forEach((r,i)=>{
    const b=S.balls[i];
    r.nameIn.value=b.name;r.colIn.value=b.color;
    r.angIn.value=b.angle;r.angVal.textContent=b.angle+'°';
    r.sizIn.value=b.size;r.sizVal.textContent=b.size+'%';
    if(b.img){r.imgEl.src=b.img;r.imgEl.style.display='block';r.plusEl.style.display='none';}
    else{r.imgEl.style.display='none';r.plusEl.style.display='block';}
  });
  syncCount();
  setRange('i_speed',S.game.speed);
  setRange('i_warmup',S.game.warmup);setRange('i_slowFactor',Math.round(S.game.slowFactor*100));
  $('#v_cut').textContent=cutName||'built-in FAAAAA';
  $('#btnCutClr').style.display=cutName?'block':'none';
  $('#i_slowOn').classList.toggle('on',S.game.slowOn);
  $('#i_sound').classList.toggle('on',S.game.sound);
  $('#i_title').value=S.text.title;$('#i_round').value=S.text.round;$('#i_handle').value=S.text.handle;
  $('#i_follow').value=S.text.follow;$('#i_next').value=S.text.next;
  $('#i_brand').value=S.brand.name;$('#selFont').value=S.game.font||'impact';syncBrandUI();
}
function openPanel(){settingsOpen=true;panel.classList.add('open');backdrop.classList.add('on');renderHS();}
function closePanel(){settingsOpen=false;panel.classList.remove('open');backdrop.classList.remove('on');}

/* ---------------- boot ---------------- */
function preloadImgs(){
  S.balls.forEach((b,i)=>{
    if(b.img){const im=new Image();im.onload=()=>{trailImgs[i]=im;};im.onerror=()=>{};im.src=b.img;}
  });
}
window.addEventListener('load',()=>{
  sizeCanvas();
  try{const cu=localStorage.getItem('dp_cut_sound');if(cu)setCutSound(cu,'saved cut sound');}catch(e){}
  buildUI();
  preloadImgs();
  buildBalls();
  requestAnimationFrame(frame);
  const t0=performance.now(),D=1100;
  (function tick(n){
    const p=clamp((n-t0)/D,0,1);
    $('#ldFill').style.width=(p*100)+'%';
    if(p<1)requestAnimationFrame(tick);
    else setTimeout(()=>{
      const ld=$('#loader');
      if(ld){ld.classList.add('hide');setTimeout(()=>ld.remove(),600);}
    },180);
  })(t0);
});
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
